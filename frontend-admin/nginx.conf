server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Archivos Estáticos de Django (CSS/JS de Django Admin y DRF)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Archivos subidos por usuarios (Imágenes/Archivos multimedia)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Peticiones API, Admin y Documentación OpenAPI de Django
    location ~ ^/(api|admin|schema|docs)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Frontend Panel Administrativo (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
