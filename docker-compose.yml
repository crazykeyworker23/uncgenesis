services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: genesis_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genesis_db}
      POSTGRES_USER: ${POSTGRES_USER:-genesis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genesis_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - genesis_network

  # Servidor Redis para Cache y Celery Broker
  redis:
    image: redis:7-alpine
    container_name: genesis_redis
    restart: always
    networks:
      - genesis_network

  # Backend Django (Django REST Framework + Gunicorn)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genesis_backend
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
    environment:
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgres://${POSTGRES_USER:-genesis_admin}:${POSTGRES_PASSWORD:-genesis_secure_password}@db:5432/${POSTGRES_DB:-genesis_db}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    depends_on:
      - db
      - redis
    networks:
      - genesis_network

  # Celery Worker para procesamiento asíncrono
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genesis_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-genesis_admin}:${POSTGRES_PASSWORD:-genesis_secure_password}@db:5432/${POSTGRES_DB:-genesis_db}
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    depends_on:
      - db
      - redis
      - backend
    networks:
      - genesis_network

  # Celery Beat para planificación de tareas
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genesis_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-genesis_admin}:${POSTGRES_PASSWORD:-genesis_secure_password}@db:5432/${POSTGRES_DB:-genesis_db}
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    depends_on:
      - db
      - redis
      - backend
    networks:
      - genesis_network

  # Gateway Web de Puerto Único (Nginx + Frontend React SPA)
  web:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: genesis_web_gateway
    restart: always
    ports:
      - "${PORT:-80}:80"
    volumes:
      - staticfiles_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - backend
    networks:
      - genesis_network

volumes:
  postgres_data:
    driver: local
  staticfiles_data:
    driver: local
  media_data:
    driver: local

networks:
  genesis_network:
    driver: bridge
