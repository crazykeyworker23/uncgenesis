name: genesis_app
description: "Génesis App - Aplicación Móvil Pública"
publish_to: 'none'

# El número tras el "+" es el versionCode de Android: debe subir en cada
# entrega o el sistema rechaza la instalación como actualización.
version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Textos de los diálogos que trae Flutter —calendario y reloj— en español.
  # Sin esto, el líder elegía la fecha de la reunión en un calendario cuyos
  # botones decían "CANCEL" y "OK" en medio de una app en castellano.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # HTTP Client
  dio: ^5.5.0

  # Serialization & Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Security & Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Firebase & Notifications
  firebase_core: ^3.2.0
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.1.2

  # Network & Caching
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.3

  # UI Utilities & Media
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  url_launcher: ^6.3.0
  share_plus: ^9.0.0

  # Geolocation & Maps
  geolocator: ^12.0.0
  google_maps_flutter: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
    - assets/icons/
    - assets/animations/
